<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Chat</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    height:100vh;
    background:#111214;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:420px;
    height:650px;
    background:#1e1f22;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px #000;
}

#login{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:40px;
    text-align:center;
    color:white;
}

.logo{
    font-size:50px;
}

h1{
    margin:10px;
}

p{
    color:#aaa;
}

input{
    padding:15px;
    border-radius:12px;
    border:none;
    outline:none;
    background:#2b2d31;
    color:white;
    font-size:16px;
}

button{
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#5865f2;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#4752c4;
}


#chat{
    display:none;
    height:100%;
    flex-direction:column;
}


.header{
    background:#5865f2;
    padding:20px;
    color:white;
    font-size:20px;
    font-weight:bold;
}


.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}


.message{
    background:#2b2d31;
    color:white;
    padding:12px;
    border-radius:12px;
    margin-bottom:12px;
}


.time{
    color:#aaa;
    font-size:12px;
}


.bottom{
    display:flex;
    gap:10px;
    padding:15px;
}


.bottom input{
    flex:1;
}


.bottom button{
    width:90px;
    margin:0;
}

</style>

</head>

<body>


<div class="app">


<div id="login">

<div class="logo">💬</div>

<h1>Live Chat</h1>

<p>Choose your name</p>

<input id="name" placeholder="Your name">

<button onclick="join()">Join</button>

</div>



<div id="chat">

<div class="header">
💬 Live Chat
</div>


<div class="messages" id="messages"></div>


<div class="bottom">

<input id="text" placeholder="Message...">

<button onclick="send()">Send</button>

</div>


</div>


</div>



<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getDatabase,
ref,
push,
onValue
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig = {

apiKey: "AIzaSyCfITGGV_UQcQFd4e9moCh4eOmVpghfJJ0",

authDomain: "lowen-8d43b.firebaseapp.com",

databaseURL: "https://lowen-8d43b-default-rtdb.asia-southeast1.firebasedatabase.app/",

projectId: "lowen-8d43b",

storageBucket: "lowen-8d43b.firebasestorage.app",

messagingSenderId: "57995970905",

appId: "1:57995970905:web:e31db3e11fd4d0015c2448",

measurementId: "G-CC3LP3FD34"

};



const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


const messagesRef = ref(db,"messages");


let username = "";



window.join = function(){

let name = document.getElementById("name").value.trim();


if(name === ""){

alert("Enter your name");

return;

}


username = name;


document.getElementById("login").style.display="none";

document.getElementById("chat").style.display="flex";


};



window.send = function(){

let input = document.getElementById("text");

let text = input.value.trim();


if(text === "") return;


push(messagesRef,{

name: username,

text: text,

time: Date.now()

});


input.value="";

};



onValue(messagesRef,(snapshot)=>{


const box=document.getElementById("messages");


box.innerHTML="";


snapshot.forEach((child)=>{


let msg=child.val();


box.innerHTML += `

<div class="message">

<b>${msg.name}</b><br>

${msg.text}

<br>

<span class="time">

${new Date(msg.time).toLocaleTimeString()}

</span>

</div>

`;

});


box.scrollTop = box.scrollHeight;


});



</script>


</body>
</html>
